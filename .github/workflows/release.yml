# Pushing a tag like v0.5.1 builds the signed installer and publishes a GitHub Release with the
# installer, its .sig file and latest.json (the file the installed app asks for updates).
# The signing key comes from two repository secrets that the owner sets by hand.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm (the version is pinned by packageManager in package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Nerd's Workbench v__VERSION__"
          releaseDraft: false
          prerelease: false
          # WHY: the updater must get the NSIS installer, the only bundle we build.
          updaterJsonPreferNsis: true
