# The same gate as on a developer PC: node tools/check.mjs runs every step in check.config.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # WHY: the secret scan reads the whole git history.
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Enable pnpm (the version is pinned by packageManager in package.json)
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - name: Install gitleaks (the gate's secret scan)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip" -OutFile gitleaks.zip
          Expand-Archive gitleaks.zip -DestinationPath "$env:RUNNER_TEMP\gitleaks"
          "$env:RUNNER_TEMP\gitleaks" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - run: node tools/check.mjs
