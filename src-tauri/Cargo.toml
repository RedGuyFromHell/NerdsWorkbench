[package]
name = "nerds-workbench"
# WHY: the real version lives in ../package.json; tauri.conf.json reads it from there.
version = "0.0.0"
description = "Nerd Castle desktop tools"
authors = ["Nerd Castle"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "nerds_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
# WHY: opens the Shopify approval page in the default browser, from Rust only (no page permission).
tauri-plugin-opener = "2.7.3"
# WHY: the Shopify token and client secret live in the Windows Credential Manager.
keyring = "4.2.0"
# WHY: the same HTTP client and TLS stack the updater already builds (rustls with ring), so the
# Shopify calls add no second TLS library.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
url = "2.5.8"
# WHY: the OAuth state comes from the operating system's secure random generator.
getrandom = "0.3.4"
# WHY: Shopify signs the OAuth callback with HMAC-SHA256 of the client secret.
hmac = "0.13.0"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
