[package]
name = "nerds-workbench"
# WHY: the real version lives in ../package.json; tauri.conf.json reads it from there.
version = "0.0.0"
description = "Nerd Castle desktop tools"
authors = ["Nerd Castle"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "nerds_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.4"
